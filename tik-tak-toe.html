<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tik Tak Toe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Outfit:wght@400;600;800&display=swap">
<style>
  :root {
    --bg: #f0ece4;
    --surface: #e4dfd6;
    --board-bg: #1a1a2e;
    --grid-line: #2d2d4a;
    --text: #1a1a2e;
    --text-muted: #6b6577;
    --x-color: #e8614d;
    --x-glow: rgba(232, 97, 77, 0.3);
    --o-color: #3db8a9;
    --o-glow: rgba(61, 184, 169, 0.3);
    --win-line: #f5c542;
    --btn-bg: #1a1a2e;
    --btn-text: #f0ece4;
    --btn-hover: #2d2d4a;
    --btn-active: #e8614d;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --board-bg: #0a0a14;
      --grid-line: #2d2d4a;
      --text: #e8e4dc;
      --text-muted: #8a8492;
      --x-color: #f07563;
      --x-glow: rgba(240, 117, 99, 0.4);
      --o-color: #4dcfbf;
      --o-glow: rgba(77, 207, 191, 0.4);
      --win-line: #f5c542;
      --btn-bg: #2d2d4a;
      --btn-text: #e8e4dc;
      --btn-hover: #3d3d5c;
      --btn-active: #f07563;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --board-bg: #0a0a14;
    --grid-line: #2d2d4a;
    --text: #e8e4dc;
    --text-muted: #8a8492;
    --x-color: #f07563;
    --x-glow: rgba(240, 117, 99, 0.4);
    --o-color: #4dcfbf;
    --o-glow: rgba(77, 207, 191, 0.4);
    --win-line: #f5c542;
    --btn-bg: #2d2d4a;
    --btn-text: #e8e4dc;
    --btn-hover: #3d3d5c;
    --btn-active: #f07563;
    color-scheme: dark;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding-inline: 16px;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    max-width: 400px;
    width: 100%;
  }

  h1 {
    font-family: 'Space Grotesk', monospace, sans-serif;
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    text-align: center;
  }

  h1 .x { color: var(--x-color); }
  h1 .o { color: var(--o-color); }

  .subtitle {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: -16px;
    text-align: center;
  }

  .difficulty {
    display: flex;
    gap: 8px;
  }

  .diff-btn {
    font-family: 'Outfit', system-ui, sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 6px 18px;
    border: 2px solid var(--grid-line);
    border-radius: 20px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .diff-btn:hover {
    border-color: var(--text-muted);
    color: var(--text);
  }

  .diff-btn.active {
    background: var(--btn-active);
    border-color: var(--btn-active);
    color: #fff;
  }

  .scoreboard {
    display: flex;
    gap: 24px;
    align-items: center;
    font-variant-numeric: tabular-nums;
  }

  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .score-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .score-label.x { color: var(--x-color); }
  .score-label.o { color: var(--o-color); }

  .score-value {
    font-family: 'Space Grotesk', monospace, sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
  }

  .score-sep {
    width: 1px;
    height: 32px;
    background: var(--grid-line);
  }

  .status {
    font-size: 1.05rem;
    font-weight: 600;
    min-height: 1.5em;
    text-align: center;
    transition: color 0.2s;
  }

  .status.x-turn { color: var(--x-color); }
  .status.o-turn { color: var(--o-color); }
  .status.draw { color: var(--text-muted); }
  .status.win { color: var(--win-line); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: min(340px, 85vw);
    aspect-ratio: 1;
    background: var(--grid-line);
    border-radius: 16px;
    padding: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }

  .cell {
    background: var(--board-bg);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0;
    position: relative;
    transition: background 0.15s;
    padding: 0;
  }

  .cell:first-child { border-radius: 10px 0 0 0; }
  .cell:nth-child(3) { border-radius: 0 10px 0 0; }
  .cell:nth-child(7) { border-radius: 0 0 0 10px; }
  .cell:last-child { border-radius: 0 0 10px 0; }

  .cell:hover:not(.taken):not(.game-over):not(.ai-thinking) {
    background: var(--grid-line);
  }

  .cell.taken, .cell.game-over, .cell.ai-thinking {
    cursor: default;
  }

  .cell svg {
    width: 55%;
    height: 55%;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .cell.taken svg {
    opacity: 1;
    transform: scale(1);
  }

  .cell.win-cell svg {
    filter: drop-shadow(0 0 12px var(--win-line));
  }

  .cell.win-cell {
    background: rgba(245, 197, 66, 0.08);
  }

  .x-mark line {
    stroke: var(--x-color);
    stroke-width: 8;
    stroke-linecap: round;
  }

  .o-mark circle {
    stroke: var(--o-color);
    stroke-width: 7;
    fill: none;
    stroke-linecap: round;
  }

  .cell.taken.x-cell {
    box-shadow: inset 0 0 20px var(--x-glow);
  }

  .cell.taken.o-cell {
    box-shadow: inset 0 0 20px var(--o-glow);
  }

  .actions {
    display: flex;
    gap: 12px;
  }

  button.reset {
    font-family: 'Outfit', system-ui, sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 10px 28px;
    border: none;
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.02em;
  }

  button.reset:hover { background: var(--btn-hover); }
  button.reset:active { transform: scale(0.97); }

  @media (prefers-reduced-motion: reduce) {
    .cell svg { transition: none; }
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <h1>tik<span class="x">X</span>tak<span class="o">O</span>e</h1>
  <div class="subtitle">You are <strong>X</strong> &mdash; beat the computer!</div>

  <div class="difficulty">
    <button class="diff-btn" data-diff="easy">Easy</button>
    <button class="diff-btn active" data-diff="medium">Medium</button>
    <button class="diff-btn" data-diff="hard">Hard</button>
  </div>

  <div class="scoreboard">
    <div class="score-item">
      <span class="score-label x">You (X)</span>
      <span class="score-value" id="x-score">0</span>
    </div>
    <div class="score-sep"></div>
    <div class="score-item">
      <span class="score-label">Draws</span>
      <span class="score-value" id="d-score">0</span>
    </div>
    <div class="score-sep"></div>
    <div class="score-item">
      <span class="score-label o">CPU (O)</span>
      <span class="score-value" id="o-score">0</span>
    </div>
  </div>

  <div class="status x-turn" id="status">Your turn</div>

  <div class="board" id="board"></div>

  <div class="actions">
    <button class="reset" id="new-game">New game</button>
    <button class="reset" id="reset-scores">Reset all</button>
  </div>
</div>

<script>
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const xSvg = `<svg class="x-mark" viewBox="0 0 80 80"><line x1="18" y1="18" x2="62" y2="62"/><line x1="62" y1="18" x2="18" y2="62"/></svg>`;
  const oSvg = `<svg class="o-mark" viewBox="0 0 80 80"><circle cx="40" cy="40" r="24"/></svg>`;

  let board, turn, gameOver, scores, difficulty, aiThinking;

  try {
    scores = JSON.parse(localStorage.getItem('ttt-sp-scores')) || { x: 0, o: 0, d: 0 };
  } catch { scores = { x: 0, o: 0, d: 0 }; }

  try {
    difficulty = localStorage.getItem('ttt-sp-diff') || 'medium';
  } catch { difficulty = 'medium'; }

  function renderScores() {
    document.getElementById('x-score').textContent = scores.x;
    document.getElementById('o-score').textContent = scores.o;
    document.getElementById('d-score').textContent = scores.d;
    try { localStorage.setItem('ttt-sp-scores', JSON.stringify(scores)); } catch {}
  }

  function setStatus(msg, cls) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + cls;
  }

  function setDifficulty(diff) {
    difficulty = diff;
    try { localStorage.setItem('ttt-sp-diff', diff); } catch {}
    document.querySelectorAll('.diff-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.diff === diff);
    });
    buildBoard();
  }

  document.querySelectorAll('.diff-btn').forEach(b => {
    b.addEventListener('click', () => setDifficulty(b.dataset.diff));
  });

  // Activate saved difficulty button
  document.querySelectorAll('.diff-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.diff === difficulty);
  });

  function buildBoard() {
    const container = document.getElementById('board');
    container.innerHTML = '';
    board = Array(9).fill(null);
    turn = 'X';
    gameOver = false;
    aiThinking = false;
    setStatus('Your turn', 'x-turn');

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.setAttribute('aria-label', `Cell ${i + 1}`);
      cell.addEventListener('click', () => handleClick(i, cell));
      container.appendChild(cell);
    }
  }

  function placeMarker(i, player) {
    const cell = document.getElementById('board').children[i];
    board[i] = player;
    cell.innerHTML = player === 'X' ? xSvg : oSvg;
    cell.classList.add('taken', player === 'X' ? 'x-cell' : 'o-cell');
  }

  function handleClick(i, cell) {
    if (board[i] || gameOver || turn !== 'X' || aiThinking) return;

    placeMarker(i, 'X');

    if (checkEnd('X')) return;

    turn = 'O';
    setStatus('CPU thinking...', 'o-turn');
    aiThinking = true;
    document.querySelectorAll('.cell').forEach(c => c.classList.add('ai-thinking'));

    setTimeout(() => {
      aiThinking = false;
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('ai-thinking'));
      aiMove();
    }, 350);
  }

  function checkEnd(player) {
    const winCombo = checkWin(player);
    if (winCombo) {
      gameOver = true;
      if (player === 'X') {
        setStatus('You win!', 'win');
      } else {
        setStatus('CPU wins!', 'o-turn');
      }
      scores[player.toLowerCase()]++;
      renderScores();
      winCombo.forEach(idx => {
        document.getElementById('board').children[idx].classList.add('win-cell');
      });
      markAllOver();
      return true;
    }

    if (board.every(c => c !== null)) {
      gameOver = true;
      setStatus("It's a draw!", 'draw');
      scores.d++;
      renderScores();
      markAllOver();
      return true;
    }
    return false;
  }

  function aiMove() {
    if (gameOver) return;

    let move;
    if (difficulty === 'easy') {
      move = aiEasy();
    } else if (difficulty === 'medium') {
      move = aiMedium();
    } else {
      move = aiBest();
    }

    placeMarker(move, 'O');

    if (checkEnd('O')) return;

    turn = 'X';
    setStatus('Your turn', 'x-turn');
  }

  function emptySquares() {
    return board.map((v, i) => v === null ? i : null).filter(v => v !== null);
  }

  function aiEasy() {
    const empty = emptySquares();
    return empty[Math.floor(Math.random() * empty.length)];
  }

  function aiMedium() {
    // 50% chance of optimal move, otherwise random
    if (Math.random() < 0.5) return aiBest();
    // But always take a win or block a loss
    const winMove = findWinningMove('O');
    if (winMove !== null) return winMove;
    const blockMove = findWinningMove('X');
    if (blockMove !== null) return blockMove;
    return aiEasy();
  }

  function findWinningMove(player) {
    for (const i of emptySquares()) {
      board[i] = player;
      if (checkWin(player)) { board[i] = null; return i; }
      board[i] = null;
    }
    return null;
  }

  function aiBest() {
    return minimax(board, 'O', -Infinity, Infinity).index;
  }

  function minimax(b, player, alpha, beta) {
    const empty = b.map((v, i) => v === null ? i : null).filter(v => v !== null);

    if (checkWinBoard(b, 'X')) return { score: -10 };
    if (checkWinBoard(b, 'O')) return { score: 10 };
    if (empty.length === 0) return { score: 0 };

    let best;
    if (player === 'O') {
      best = { score: -Infinity };
      for (const i of empty) {
        b[i] = 'O';
        const result = minimax(b, 'X', alpha, beta);
        b[i] = null;
        if (result.score > best.score) {
          best = { score: result.score, index: i };
        }
        alpha = Math.max(alpha, best.score);
        if (beta <= alpha) break;
      }
    } else {
      best = { score: Infinity };
      for (const i of empty) {
        b[i] = 'X';
        const result = minimax(b, 'O', alpha, beta);
        b[i] = null;
        if (result.score < best.score) {
          best = { score: result.score, index: i };
        }
        beta = Math.min(beta, best.score);
        if (beta <= alpha) break;
      }
    }
    return best;
  }

  function checkWinBoard(b, player) {
    return WINS.some(combo => combo.every(i => b[i] === player));
  }

  function checkWin(player) {
    for (const combo of WINS) {
      if (combo.every(i => board[i] === player)) return combo;
    }
    return null;
  }

  function markAllOver() {
    document.querySelectorAll('.cell').forEach(c => c.classList.add('game-over'));
  }

  document.getElementById('new-game').addEventListener('click', buildBoard);
  document.getElementById('reset-scores').addEventListener('click', () => {
    scores = { x: 0, o: 0, d: 0 };
    renderScores();
    buildBoard();
  });

  renderScores();
  buildBoard();
</script>
</body>
</html>
