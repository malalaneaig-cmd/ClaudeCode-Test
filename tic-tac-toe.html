<title>Tic Tac Toe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Outfit:wght@400;600;800&display=swap">
<style>
  :root {
    --bg: #f0ece4;
    --surface: #e4dfd6;
    --board-bg: #1a1a2e;
    --grid-line: #2d2d4a;
    --text: #1a1a2e;
    --text-muted: #6b6577;
    --x-color: #e8614d;
    --x-glow: rgba(232, 97, 77, 0.3);
    --o-color: #3db8a9;
    --o-glow: rgba(61, 184, 169, 0.3);
    --win-line: #f5c542;
    --btn-bg: #1a1a2e;
    --btn-text: #f0ece4;
    --btn-hover: #2d2d4a;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --board-bg: #0a0a14;
      --grid-line: #2d2d4a;
      --text: #e8e4dc;
      --text-muted: #8a8492;
      --x-color: #f07563;
      --x-glow: rgba(240, 117, 99, 0.4);
      --o-color: #4dcfbf;
      --o-glow: rgba(77, 207, 191, 0.4);
      --win-line: #f5c542;
      --btn-bg: #2d2d4a;
      --btn-text: #e8e4dc;
      --btn-hover: #3d3d5c;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --board-bg: #0a0a14;
    --grid-line: #2d2d4a;
    --text: #e8e4dc;
    --text-muted: #8a8492;
    --x-color: #f07563;
    --x-glow: rgba(240, 117, 99, 0.4);
    --o-color: #4dcfbf;
    --o-glow: rgba(77, 207, 191, 0.4);
    --win-line: #f5c542;
    --btn-bg: #2d2d4a;
    --btn-text: #e8e4dc;
    --btn-hover: #3d3d5c;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding-inline: 16px;
    padding-block: 0;
    margin: 0;
    box-sizing: border-box;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    max-width: 400px;
    width: 100%;
  }

  h1 {
    font-family: 'Space Grotesk', monospace, sans-serif;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    text-align: center;
  }

  h1 .x { color: var(--x-color); }
  h1 .o { color: var(--o-color); }

  .scoreboard {
    display: flex;
    gap: 24px;
    align-items: center;
    font-variant-numeric: tabular-nums;
  }

  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .score-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .score-label.x { color: var(--x-color); }
  .score-label.o { color: var(--o-color); }

  .score-value {
    font-family: 'Space Grotesk', monospace, sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
  }

  .score-sep {
    width: 1px;
    height: 32px;
    background: var(--grid-line);
  }

  .status {
    font-size: 1.05rem;
    font-weight: 600;
    min-height: 1.5em;
    text-align: center;
    transition: color 0.2s;
  }

  .status.x-turn { color: var(--x-color); }
  .status.o-turn { color: var(--o-color); }
  .status.draw { color: var(--text-muted); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: min(340px, 85vw);
    aspect-ratio: 1;
    background: var(--grid-line);
    border-radius: 16px;
    padding: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }

  .cell {
    background: var(--board-bg);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0;
    position: relative;
    transition: background 0.15s;
    padding: 0;
  }

  .cell:first-child { border-radius: 10px 0 0 0; }
  .cell:nth-child(3) { border-radius: 0 10px 0 0; }
  .cell:nth-child(7) { border-radius: 0 0 0 10px; }
  .cell:last-child { border-radius: 0 0 10px 0; }

  .cell:hover:not(.taken):not(.game-over) {
    background: var(--grid-line);
  }

  .cell.taken, .cell.game-over {
    cursor: default;
  }

  .cell svg {
    width: 55%;
    height: 55%;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .cell.taken svg {
    opacity: 1;
    transform: scale(1);
  }

  .cell.win-cell svg {
    filter: drop-shadow(0 0 12px var(--win-line));
  }

  .cell.win-cell {
    background: rgba(245, 197, 66, 0.08);
  }

  .x-mark line {
    stroke: var(--x-color);
    stroke-width: 8;
    stroke-linecap: round;
  }

  .o-mark circle {
    stroke: var(--o-color);
    stroke-width: 7;
    fill: none;
    stroke-linecap: round;
  }

  .cell.taken.x-cell {
    box-shadow: inset 0 0 20px var(--x-glow);
  }

  .cell.taken.o-cell {
    box-shadow: inset 0 0 20px var(--o-glow);
  }

  .actions {
    display: flex;
    gap: 12px;
  }

  button.reset {
    font-family: 'Outfit', system-ui, sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 10px 28px;
    border: none;
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.02em;
  }

  button.reset:hover {
    background: var(--btn-hover);
  }

  button.reset:active {
    transform: scale(0.97);
  }

  @media (prefers-reduced-motion: reduce) {
    .cell svg {
      transition: none;
    }
  }
</style>

<div class="game-wrapper">
  <h1>tic<span class="x">X</span>tac<span class="o">O</span>e</h1>

  <div class="scoreboard">
    <div class="score-item">
      <span class="score-label x">X wins</span>
      <span class="score-value" id="x-score">0</span>
    </div>
    <div class="score-sep"></div>
    <div class="score-item">
      <span class="score-label">Draws</span>
      <span class="score-value" id="d-score">0</span>
    </div>
    <div class="score-sep"></div>
    <div class="score-item">
      <span class="score-label o">O wins</span>
      <span class="score-value" id="o-score">0</span>
    </div>
  </div>

  <div class="status x-turn" id="status">X's turn</div>

  <div class="board" id="board"></div>

  <div class="actions">
    <button class="reset" id="new-game">New game</button>
    <button class="reset" id="reset-scores">Reset all</button>
  </div>
</div>

<script>
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const xSvg = `<svg class="x-mark" viewBox="0 0 80 80"><line x1="18" y1="18" x2="62" y2="62"/><line x1="62" y1="18" x2="18" y2="62"/></svg>`;
  const oSvg = `<svg class="o-mark" viewBox="0 0 80 80"><circle cx="40" cy="40" r="24"/></svg>`;

  let board, turn, gameOver, scores;

  try {
    scores = JSON.parse(localStorage.getItem('ttt-scores')) || { x: 0, o: 0, d: 0 };
  } catch { scores = { x: 0, o: 0, d: 0 }; }

  function renderScores() {
    document.getElementById('x-score').textContent = scores.x;
    document.getElementById('o-score').textContent = scores.o;
    document.getElementById('d-score').textContent = scores.d;
    try { localStorage.setItem('ttt-scores', JSON.stringify(scores)); } catch {}
  }

  function setStatus(msg, cls) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + cls;
  }

  function buildBoard() {
    const container = document.getElementById('board');
    container.innerHTML = '';
    board = Array(9).fill(null);
    turn = 'X';
    gameOver = false;
    setStatus("X's turn", 'x-turn');

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.setAttribute('aria-label', `Cell ${i + 1}`);
      cell.addEventListener('click', () => handleClick(i, cell));
      container.appendChild(cell);
    }
  }

  function handleClick(i, cell) {
    if (board[i] || gameOver) return;

    board[i] = turn;
    cell.innerHTML = turn === 'X' ? xSvg : oSvg;
    cell.classList.add('taken', turn === 'X' ? 'x-cell' : 'o-cell');

    const winCombo = checkWin(turn);
    if (winCombo) {
      gameOver = true;
      setStatus(`${turn} wins!`, turn === 'X' ? 'x-turn' : 'o-turn');
      scores[turn.toLowerCase()]++;
      renderScores();
      winCombo.forEach(idx => {
        document.getElementById('board').children[idx].classList.add('win-cell');
      });
      markAllOver();
      return;
    }

    if (board.every(c => c !== null)) {
      gameOver = true;
      setStatus("It's a draw", 'draw');
      scores.d++;
      renderScores();
      markAllOver();
      return;
    }

    turn = turn === 'X' ? 'O' : 'X';
    setStatus(`${turn}'s turn`, turn === 'X' ? 'x-turn' : 'o-turn');
  }

  function checkWin(player) {
    for (const combo of WINS) {
      if (combo.every(i => board[i] === player)) return combo;
    }
    return null;
  }

  function markAllOver() {
    document.querySelectorAll('.cell').forEach(c => c.classList.add('game-over'));
  }

  document.getElementById('new-game').addEventListener('click', buildBoard);
  document.getElementById('reset-scores').addEventListener('click', () => {
    scores = { x: 0, o: 0, d: 0 };
    renderScores();
    buildBoard();
  });

  renderScores();
  buildBoard();
</script>
