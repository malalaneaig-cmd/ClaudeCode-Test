function drawText(str, x, y, scale, color) {
  ctx.fillStyle = color;
  const s = str.toUpperCase();
  let cx = x;
  for (let i = 0; i < s.length; i++) {
    const glyph = FONT[s[i]];
    if (glyph) {
      for (let row = 0; row < 7; row++) {
        for (let col = 0; col < 5; col++) {
          if (glyph[row] & (1 << (4 - col))) {
            ctx.fillRect(Math.round(cx + col * scale), Math.round(y + row * scale), scale, scale);
          }
        }
      }
    }
    cx += 6 * scale;
  }
}

function textWidth(str, scale) {
  return str.length * 6 * scale - scale;
}

function drawSprite(data, palette, x, y, angle, scale, flash) {
  const rows = data.length;
  const cols = data[0].length;
  const hw = (cols * scale) / 2;
  const hh = (rows * scale) / 2;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.rotate(angle - Math.PI / 2);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = data[r][c];
      if (v === 0) continue;
      ctx.fillStyle = flash ? '#ffffff' : palette[v];
      ctx.fillRect(Math.round(-hw + c * scale), Math.round(-hh + r * scale), scale, scale);
    }
  }
  ctx.restore();
}

// ============================================================
// SECTION 4: UTILITY FUNCTIONS
// ============================================================
function dist(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  return Math.sqrt(dx * dx + dy * dy);
}

function angleTo(x1, y1, x2, y2) {
  return Math.atan2(y2 - y1, x2 - x1);
}

function normalize(vx, vy) {
  const len = Math.sqrt(vx * vx + vy * vy);
  if (len === 0) return { x: 0, y: 0 };
  return { x: vx / len, y: vy / len };
}

function clamp(v, min, max) {
  return v < min ? min : v > max ? max : v;
}

function rng(min, max) {
  return min + Math.random() * (max - min);
}

function rngInt(min, max) {
  return Math.floor(rng(min, max + 1));
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function createBullet(x, y, angle, speed, isEnemy) {
  for (let i = 0; i < game.bullets.length; i++) {
    if (!game.bullets[i].alive) {
      const b = game.bullets[i];
      b.x = x; b.y = y; b.vx = Math.cos(angle) * speed; b.vy = Math.sin(angle) * speed;
      b.alive = true; b.isEnemy = isEnemy; b.age = 0;
      b.prevX = x; b.prevY = y; b.prevX2 = x; b.prevY2 = y;
      return b;
    }
  }
  if (game.bullets.length < MAX_BULLETS) {
    const b = { x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      alive: true, isEnemy, age: 0, prevX: x, prevY: y, prevX2: x, prevY2: y };
    game.bullets.push(b);
    return b;
  }
  return null;
}

function createEnemy(type, x, y) {
  const defs = [
    { radius: 5, speed: 60, hp: 1, score: 100, sprite: 'grunt' },
    { radius: 5, speed: 70, hp: 1, score: 200, sprite: 'dasher' },
    { radius: 7, speed: 40, hp: 3, score: 300, sprite: 'tank' },
    { radius: 5, speed: 45, hp: 2, score: 400, sprite: 'shooter' },
  ];
  const d = defs[type];
  return {
    x, y, type, radius: d.radius, speed: d.speed, hp: d.hp, maxHp: d.hp,
    score: d.score, sprite: d.sprite, alive: true, flash: 0,
    angle: 0, chargeTimer: type === 1 ? rng(1.5, 3) : 0,
    chargeState: 'seek', chargeCooldown: 0, chargeDir: 0,
    shootTimer: type === 3 ? rng(1.5, 2.5) : 0,
    boss: false, bossHpMax: 0,
  };
}

function createBoss(hp) {
  const edge = rngInt(0, 3);
  let x, y;
  if (edge === 0) { x = rng(50, W - 50); y = -20; }
  else if (edge === 1) { x = rng(50, W - 50); y = H + 20; }
  else if (edge === 2) { x = -20; y = rng(50, H - 50); }
  else { x = W + 20; y = rng(50, H - 50); }
  const e = createEnemy(3, x, y);
  e.boss = true;
  e.hp = hp;
  e.maxHp = hp;
  e.bossHpMax = hp;
  e.radius = 14;
  e.speed = 35;
  e.score = 1000;
  e.shootTimer = 1;
  return e;
}

function spawnParticles(x, y, count, color, speed, life, size) {
  for (let i = 0; i < count; i++) {
    if (game.particles.length >= MAX_PARTICLES) {
      let oldest = 0;
      for (let j = 1; j < game.particles.length; j++) {
        if (game.particles[j].life < game.particles[oldest].life) oldest = j;
      }
      const p = game.particles[oldest];
      p.x = x; p.y = y;
      const a = rng(0, Math.PI * 2);
      const s = rng(speed * 0.5, speed);
      p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
      p.life = life; p.maxLife = life; p.size = size || rng(1, 3);
      p.color = color; p.alive = true;
    } else {
      const a = rng(0, Math.PI * 2);
      const s = rng(speed * 0.5, speed);
      game.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life, maxLife: life, size: size || rng(1, 3), color, alive: true,
      });
    }
  }
}

function createFloatingText(x, y, text, color) {
  game.floatingTexts.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
}

const input = { keys: {}, mouseX: W / 2, mouseY: H / 2, mouseDown: false };

const game = {};

function resetGame() {
  game.state = 'MENU';
  game.player = {
    x: W / 2, y: H / 2, angle: 0, hp: PLAYER_MAX_HP, maxHp: PLAYER_MAX_HP,
    invincible: 0, shootCooldown: 0, animFrame: 0, animTimer: 0,
    muzzleFlash: 0, moving: false,
  };
  game.bullets = [];
  game.enemies = [];
  game.particles = [];
  game.enemyBullets = [];
  game.floatingTexts = [];
  game.score = 0;
  game.level = 1;
  game.loop = 0;
  game.enemiesSpawned = 0;
  game.enemiesKilled = 0;
  game.totalKills = 0;
  game.shotsFired = 0;
  game.shotsHit = 0;
  game.spawnTimer = 1.5;
  game.bossSpawned = false;
  game.shake = 0;
  game.shakeDur = 0;
  game.transitionTimer = 0;
  game.menuTime = 0;
  game.stars = [];
  for (let i = 0; i < 60; i++) {
    game.stars.push({ x: rng(0, W), y: rng(0, H), s: rng(0.5, 1.5), b: rng(0.3, 1) });
  }
  game.highScore = 0;
  try { game.highScore = parseInt(localStorage.getItem('pb-highscore')) || 0; } catch {}
}

function startLevel() {
  game.enemies = [];
  game.bullets = [];
  game.enemyBullets = [];
  game.enemiesSpawned = 0;
  game.enemiesKilled = 0;
  game.spawnTimer = 1.0;
  game.bossSpawned = false;
  game.player.x = W / 2;
  game.player.y = H / 2;
}

function getLevelConfig() {
  const idx = Math.min(game.level - 1, LEVELS.length - 1);
  const base = LEVELS[idx];
  const extra = Math.max(0, game.level - LEVELS.length);
  return {
    totalEnemies: base.totalEnemies + extra * 5,
    spawnInterval: Math.max(0.4, base.spawnInterval - extra * 0.05),
    speedMult: base.speedMult + extra * 0.1,
    types: base.types,
    boss: base.boss || (extra > 0 && game.level % 5 === 0),
    bossHp: base.bossHp + extra * 10,
  };
}

// ============================================================
// SECTION 7: INPUT HANDLING
// ============================================================
window.addEventListener('keydown', e => {
  input.keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter' && game.state === 'MENU') {
    game.state = 'PLAYING';
    startLevel();
  }
  if (e.code === 'KeyR' && game.state === 'GAME_OVER') {
    resetGame();
    game.state = 'PLAYING';
    startLevel();
  }
  if (e.code === 'Escape' && game.state === 'PLAYING') {
    game.state = 'PAUSED';
  } else if (e.code === 'Escape' && game.state === 'PAUSED') {
    game.state = 'PLAYING';
  }
});

window.addEventListener('keyup', e => { input.keys[e.code] = false; });

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  input.mouseX = (e.clientX - rect.left) * scaleX;
  input.mouseY = (e.clientY - rect.top) * scaleY;
});

canvas.addEventListener('mousedown', e => { if (e.button === 0) input.mouseDown = true; });
canvas.addEventListener('mouseup', e => { if (e.button === 0) input.mouseDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

function triggerShake(amount, duration) {
  game.shake = amount;
  game.shakeDur = duration;
}

function updatePlaying(dt) {
  const p = game.player;
  const cfg = getLevelConfig();

  // Player movement
  let dx = 0, dy = 0;
  if (input.keys['ArrowLeft'] || input.keys['KeyA']) dx -= 1;
  if (input.keys['ArrowRight'] || input.keys['KeyD']) dx += 1;
  if (input.keys['ArrowUp'] || input.keys['KeyW']) dy -= 1;
  if (input.keys['ArrowDown'] || input.keys['KeyS']) dy += 1;
  const dir = normalize(dx, dy);
  p.x += dir.x * PLAYER_SPEED * dt;
  p.y += dir.y * PLAYER_SPEED * dt;
  p.x = clamp(p.x, 12, W - 12);
  p.y = clamp(p.y, 12, H - 12);
  p.moving = dx !== 0 || dy !== 0;

  if (p.moving) {
    p.animTimer += dt;
    if (p.animTimer > 0.15) { p.animTimer = 0; p.animFrame = 1 - p.animFrame; }
  } else {
    p.animFrame = 0;
    p.animTimer = 0;
  }

  // Aiming
  p.angle = angleTo(p.x, p.y, input.mouseX, input.mouseY);

  // Shooting
  p.shootCooldown -= dt;
  p.muzzleFlash -= dt;
  if (input.mouseDown && p.shootCooldown <= 0) {
    p.shootCooldown = SHOOT_COOLDOWN;
    p.muzzleFlash = 0.06;
    game.shotsFired++;
    const tipX = p.x + Math.cos(p.angle) * 14;
    const tipY = p.y + Math.sin(p.angle) * 14;
    createBullet(tipX, tipY, p.angle, BULLET_SPEED, false);
    spawnParticles(tipX, tipY, 4, '#ffff88', 80, 0.1, 2);
    triggerShake(1.5, 0.05);
  }

  // Invincibility
  if (p.invincible > 0) p.invincible -= dt;

  // Footstep dust
  if (p.moving && Math.random() < dt * 5) {
    spawnParticles(p.x - dir.x * 5, p.y - dir.y * 5, 1, '#666655', 20, 0.3, 1);
  }

  // Spawn enemies
  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0 && game.enemiesSpawned < cfg.totalEnemies) {
    game.spawnTimer = cfg.spawnInterval;
    const type = pick(cfg.types);
    let ex, ey;
    do {
      const edge = rngInt(0, 3);
      if (edge === 0) { ex = rng(10, W - 10); ey = -15; }
      else if (edge === 1) { ex = rng(10, W - 10); ey = H + 15; }
      else if (edge === 2) { ex = -15; ey = rng(10, H - 10); }
      else { ex = W + 15; ey = rng(10, H - 10); }
    } while (dist(ex, ey, p.x, p.y) < 100);
    const enemy = createEnemy(type, ex, ey);
    enemy.speed *= cfg.speedMult;
    game.enemies.push(enemy);
    game.enemiesSpawned++;
  }

  // Boss spawn
  if (cfg.boss && !game.bossSpawned && game.enemiesSpawned >= cfg.totalEnemies - 1) {
    const boss = createBoss(cfg.bossHp);
    game.enemies.push(boss);
    game.bossSpawned = true;
    game.enemiesSpawned++;
  }

  // Update enemies
  for (const e of game.enemies) {
    if (!e.alive) continue;
    e.flash -= dt;
    const toPlayer = angleTo(e.x, e.y, p.x, p.y);
    e.angle = toPlayer;

    if (e.type === 1) {
      // Dasher
      if (e.chargeState === 'seek') {
        e.x += Math.cos(toPlayer) * e.speed * dt;
        e.y += Math.sin(toPlayer) * e.speed * dt;
        e.chargeTimer -= dt;
        if (e.chargeTimer <= 0) {
          e.chargeState = 'charge';
          e.chargeDir = toPlayer;
          e.chargeTimer = 0.3;
        }
      } else if (e.chargeState === 'charge') {
        e.x += Math.cos(e.chargeDir) * e.speed * 3 * dt;
        e.y += Math.sin(e.chargeDir) * e.speed * 3 * dt;
        if (Math.random() < dt * 15) {
          spawnParticles(e.x, e.y, 1, C.DASHER_HIGHLIGHT, 30, 0.15, 1);
        }
        e.chargeTimer -= dt;
        if (e.chargeTimer <= 0) {
          e.chargeState = 'cooldown';
          e.chargeTimer = 1.0;
        }
      } else {
        e.chargeTimer -= dt;
        if (e.chargeTimer <= 0) {
          e.chargeState = 'seek';
          e.chargeTimer = rng(1.5, 3);
        }
      }
    } else if (e.type === 3 || e.boss) {
      // Shooter / Boss
      const d = dist(e.x, e.y, p.x, p.y);
      const preferred = e.boss ? 120 : 150;
      if (d > preferred + 20) {
        e.x += Math.cos(toPlayer) * e.speed * dt;
        e.y += Math.sin(toPlayer) * e.speed * dt;
      } else if (d < preferred - 20) {
        e.x -= Math.cos(toPlayer) * e.speed * 0.5 * dt;
        e.y -= Math.sin(toPlayer) * e.speed * 0.5 * dt;
      } else {
        const perp = toPlayer + Math.PI / 2;
        e.x += Math.cos(perp) * e.speed * 0.6 * dt;
        e.y += Math.sin(perp) * e.speed * 0.6 * dt;
      }
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        e.shootTimer = e.boss ? 0.8 : rng(1.5, 2.5);
        createBullet(e.x, e.y, toPlayer, 120, true);
        if (e.boss) {
          createBullet(e.x, e.y, toPlayer - 0.15, 120, true);
          createBullet(e.x, e.y, toPlayer + 0.15, 120, true);
        }
      }
    } else {
      // Grunt and Tank
      e.x += Math.cos(toPlayer) * e.speed * dt;
      e.y += Math.sin(toPlayer) * e.speed * dt;
    }

    // Clamp enemies to slightly outside arena
    e.x = clamp(e.x, -30, W + 30);
    e.y = clamp(e.y, -30, H + 30);
  }

  // Update bullets
  for (const b of game.bullets) {
    if (!b.alive) continue;
    b.prevX2 = b.prevX; b.prevY2 = b.prevY;
    b.prevX = b.x; b.prevY = b.y;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.age += dt;
    if (b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) {
      b.alive = false;
    }
  }

  // Update particles
  for (const pt of game.particles) {
    if (!pt.alive) continue;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) pt.alive = false;
  }

  // Update floating texts
  for (let i = game.floatingTexts.length - 1; i >= 0; i--) {
    const ft = game.floatingTexts[i];
    ft.y -= 30 * dt;
    ft.life -= dt;
    if (ft.life <= 0) game.floatingTexts.splice(i, 1);
  }

  // Collisions: player bullets vs enemies
  for (const b of game.bullets) {
    if (!b.alive || b.isEnemy) continue;
    for (const e of game.enemies) {
      if (!e.alive) continue;
      if (dist(b.x, b.y, e.x, e.y) < e.radius + 2) {
        b.alive = false;
        e.hp--;
        e.flash = 0.08;
        game.shotsHit++;
        spawnParticles(b.x, b.y, 3, '#ffff88', 50, 0.15, 1);
        if (e.hp <= 0) {
          e.alive = false;
          game.enemiesKilled++;
          game.totalKills++;
          game.score += e.score;
          const col = PALETTES[e.sprite] ? PALETTES[e.sprite][2] : '#ff4444';
          spawnParticles(e.x, e.y, e.boss ? 30 : 10, col, e.boss ? 150 : 100, e.boss ? 0.6 : 0.4);
          createFloatingText(e.x, e.y - 10, '+' + e.score, '#ffff44');
          triggerShake(e.boss ? 8 : 2, e.boss ? 0.3 : 0.08);
        } else {
          triggerShake(1, 0.04);
        }
        break;
      }
    }
  }

  // Collisions: enemies vs player
  if (p.invincible <= 0) {
    for (const e of game.enemies) {
      if (!e.alive) continue;
      if (dist(e.x, e.y, p.x, p.y) < e.radius + 6) {
        p.hp--;
        p.invincible = INVINCIBLE_TIME;
        spawnParticles(p.x, p.y, 6, '#ff4444', 60, 0.3, 2);
        triggerShake(5, 0.15);
        if (p.hp <= 0) {
          spawnParticles(p.x, p.y, 25, '#33ff66', 120, 0.5, 2);
          game.state = 'GAME_OVER';
          if (game.score > game.highScore) {
            game.highScore = game.score;
            try { localStorage.setItem('pb-highscore', game.highScore); } catch {}
          }
          return;
        }
        break;
      }
    }
  }

  // Collisions: enemy bullets vs player
  if (p.invincible <= 0) {
    for (const b of game.bullets) {
      if (!b.alive || !b.isEnemy) continue;
      if (dist(b.x, b.y, p.x, p.y) < 8) {
        b.alive = false;
        p.hp--;
        p.invincible = INVINCIBLE_TIME;
        spawnParticles(p.x, p.y, 6, '#ff4444', 60, 0.3, 2);
        triggerShake(5, 0.15);
        if (p.hp <= 0) {
          spawnParticles(p.x, p.y, 25, '#33ff66', 120, 0.5, 2);
          game.state = 'GAME_OVER';
          if (game.score > game.highScore) {
            game.highScore = game.score;
            try { localStorage.setItem('pb-highscore', game.highScore); } catch {}
          }
          return;
        }
        break;
      }
    }
  }

  // Check wave complete
  const allSpawned = game.enemiesSpawned >= getLevelConfig().totalEnemies + (cfg.boss ? 1 : 0);
  const allDead = game.enemies.every(e => !e.alive);
  if (allSpawned && allDead && game.enemiesKilled > 0) {
    game.state = 'LEVEL_TRANSITION';
    game.transitionTimer = 3;
    game.player.hp = Math.min(game.player.hp + 1, game.player.maxHp);
  }

  // Screen shake decay
  if (game.shakeDur > 0) {
    game.shakeDur -= dt;
    if (game.shakeDur <= 0) game.shake = 0;
  }
}

function updateTransition(dt) {
  game.transitionTimer -= dt;
  if (game.transitionTimer <= 0) {
    game.level++;
    game.state = 'PLAYING';
    startLevel();
  }
}

// ============================================================
// SECTION 9: RENDER FUNCTIONS
// ============================================================
function renderBackground() {
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 32) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 32) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function renderPlayer() {
  const p = game.player;
  if (p.invincible > 0 && Math.floor(p.invincible * 16) % 2 === 0) return;

  const spriteData = SPRITES.player[p.animFrame];
  drawSprite(spriteData, PALETTES.player, p.x, p.y, p.angle + Math.PI / 2, 2, false);

  // Gun
  ctx.save();
  ctx.translate(Math.round(p.x), Math.round(p.y));
  ctx.rotate(p.angle);
  ctx.fillStyle = C.GUN_DARK;
  ctx.fillRect(6, -3, 10, 6);
  ctx.fillStyle = C.GUN;
  ctx.fillRect(7, -2, 8, 4);
  ctx.restore();

  // Muzzle flash
  if (p.muzzleFlash > 0) {
    const tipX = p.x + Math.cos(p.angle) * 16;
    const tipY = p.y + Math.sin(p.angle) * 16;
    ctx.globalAlpha = p.muzzleFlash / 0.06;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(tipX, tipY, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffff44';
    ctx.beginPath();
    ctx.arc(tipX, tipY, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function renderEnemies() {
  for (const e of game.enemies) {
    if (!e.alive) continue;
    const sprite = SPRITES[e.sprite];
    if (!sprite) continue;
    const pal = PALETTES[e.sprite];
    const scale = e.boss ? 3 : 2;
    drawSprite(sprite[0], pal, e.x, e.y, e.angle + Math.PI / 2, scale, e.flash > 0);

    // Shooter turret indicator
    if (e.type === 3 || e.boss) {
      ctx.save();
      ctx.translate(Math.round(e.x), Math.round(e.y));
      ctx.rotate(e.angle);
      const len = e.boss ? 18 : 10;
      ctx.fillStyle = e.boss ? C.BOSS_OUTLINE : C.SHOOTER_HIGHLIGHT;
      ctx.fillRect(e.radius - 2, -2, len, 4);
      ctx.restore();
    }

    // Boss HP bar
    if (e.boss) {
      const bw = 30;
      const bh = 4;
      const bx = e.x - bw / 2;
      const by = e.y - e.radius * 2 - 8;
      ctx.fillStyle = '#440000';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(bx, by, bw * (e.hp / e.bossHpMax), bh);
      ctx.strokeStyle = '#ff6666';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, bh);
    }

    // Boss pulsing outline
    if (e.boss) {
      const pulse = 0.5 + Math.sin(performance.now() / 150) * 0.5;
      ctx.strokeStyle = `rgba(255, 68, 68, ${pulse * 0.6})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

function renderBullets() {
  for (const b of game.bullets) {
    if (!b.alive) continue;
    // Trail
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = b.isEnemy ? C.ENEMY_BULLET : C.BULLET;
    ctx.fillRect(Math.round(b.prevX2) - 1, Math.round(b.prevY2) - 1, 3, 3);
    ctx.globalAlpha = 0.35;
    ctx.fillRect(Math.round(b.prevX) - 1, Math.round(b.prevY) - 1, 3, 3);
    ctx.globalAlpha = 1;
    // Bullet
    ctx.fillStyle = b.isEnemy ? C.ENEMY_BULLET : C.BULLET;
    ctx.fillRect(Math.round(b.x) - 2, Math.round(b.y) - 2, 4, 4);
    ctx.fillStyle = b.isEnemy ? '#ff8833' : C.BULLET_CORE;
    ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 1, 2, 2);
  }
}

function renderParticles() {
  for (const pt of game.particles) {
    if (!pt.alive) continue;
    const alpha = pt.life / pt.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = pt.color;
    const s = Math.max(1, pt.size * alpha);
    ctx.fillRect(Math.round(pt.x), Math.round(pt.y), Math.ceil(s), Math.ceil(s));
  }
  ctx.globalAlpha = 1;
}

function renderFloatingTexts() {
  for (const ft of game.floatingTexts) {
    const alpha = ft.life / ft.maxLife;
    ctx.globalAlpha = alpha;
    const tw = textWidth(ft.text, 1);
    drawText(ft.text, ft.x - tw / 2, ft.y, 1, ft.color);
  }
  ctx.globalAlpha = 1;
}

function renderHUD() {
  const p = game.player;
  // Hearts
  for (let i = 0; i < p.maxHp; i++) {
    const hx = 8 + i * 14;
    const hy = 8;
    if (i < p.hp) {
      ctx.fillStyle = '#ff3344';
      ctx.fillRect(hx + 1, hy, 3, 1);
      ctx.fillRect(hx + 5, hy, 3, 1);
      ctx.fillRect(hx, hy + 1, 9, 1);
      ctx.fillRect(hx, hy + 2, 9, 1);
      ctx.fillRect(hx + 1, hy + 3, 7, 1);
      ctx.fillRect(hx + 2, hy + 4, 5, 1);
      ctx.fillRect(hx + 3, hy + 5, 3, 1);
      ctx.fillRect(hx + 4, hy + 6, 1, 1);
    } else {
      ctx.fillStyle = '#331111';
      ctx.fillRect(hx + 1, hy, 3, 1);
      ctx.fillRect(hx + 5, hy, 3, 1);
      ctx.fillRect(hx, hy + 1, 9, 1);
      ctx.fillRect(hx, hy + 2, 9, 1);
      ctx.fillRect(hx + 1, hy + 3, 7, 1);
      ctx.fillRect(hx + 2, hy + 4, 5, 1);
      ctx.fillRect(hx + 3, hy + 5, 3, 1);
      ctx.fillRect(hx + 4, hy + 6, 1, 1);
    }
  }

  // Level
  const lvlText = 'LEVEL ' + game.level;
  drawText(lvlText, W - textWidth(lvlText, 1) - 8, 8, 1, '#aaaaaa');

  // Score
  const scoreText = String(game.score).padStart(7, '0');
  drawText(scoreText, W - textWidth(scoreText, 1) - 8, 18, 1, '#ffff44');

  // Enemy counter
  const cfg = getLevelConfig();
  const remaining = cfg.totalEnemies + (cfg.boss ? 1 : 0) - game.enemiesKilled;
  const counterText = 'ENEMIES: ' + remaining;
  drawText(counterText, W / 2 - textWidth(counterText, 1) / 2, 8, 1, '#888888');
}

function renderMenu() {
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, W, H);

  // Stars
  game.menuTime += 0.016;
  for (const star of game.stars) {
    star.y += star.s * 0.3;
    if (star.y > H) { star.y = 0; star.x = rng(0, W); }
    const flicker = 0.6 + Math.sin(game.menuTime * 3 + star.x) * 0.4;
    ctx.globalAlpha = star.b * flicker;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(star.x), Math.round(star.y), 1, 1);
  }
  ctx.globalAlpha = 1;

  // Title
  const hue = (game.menuTime * 40) % 360;
  const titleColor = `hsl(${hue}, 80%, 60%)`;
  const title = 'PIXEL BLITZ';
  const tw = textWidth(title, 4);
  drawText(title, W / 2 - tw / 2, 120, 4, titleColor);

  // Subtitle
  const sub = 'A RETRO SHOOTER';
  drawText(sub, W / 2 - textWidth(sub, 2) / 2, 165, 2, '#667788');

  // High score
  if (game.highScore > 0) {
    const hs = 'BEST: ' + game.highScore;
    drawText(hs, W / 2 - textWidth(hs, 1) / 2, 210, 1, '#888866');
  }

  // Press enter
  if (Math.floor(game.menuTime * 2) % 2 === 0) {
    const start = 'PRESS ENTER TO START';
    drawText(start, W / 2 - textWidth(start, 2) / 2, 280, 2, '#ffffff');
  }

  // Controls
  const c1 = 'ARROWS OR WASD: MOVE';
  const c2 = 'MOUSE: AIM AND SHOOT';
  const c3 = 'ESC: PAUSE';
  drawText(c1, W / 2 - textWidth(c1, 1) / 2, 370, 1, '#445566');
  drawText(c2, W / 2 - textWidth(c2, 1) / 2, 385, 1, '#445566');
  drawText(c3, W / 2 - textWidth(c3, 1) / 2, 400, 1, '#445566');
}

function renderTransition() {
  renderBackground();
  renderParticles();

  const y = H / 2 - 40;
  const t1 = 'LEVEL ' + game.level + ' COMPLETE!';
  drawText(t1, W / 2 - textWidth(t1, 3) / 2, y, 3, '#44ff66');

  const kills = 'ENEMIES KILLED: ' + game.enemiesKilled;
  drawText(kills, W / 2 - textWidth(kills, 1) / 2, y + 40, 1, '#aaaaaa');

  const acc = game.shotsFired > 0 ? Math.round(game.shotsHit / game.shotsFired * 100) : 0;
  const accText = 'ACCURACY: ' + acc + '%';
  drawText(accText, W / 2 - textWidth(accText, 1) / 2, y + 55, 1, '#aaaaaa');

  const hp = 'HP RESTORED +1';
  drawText(hp, W / 2 - textWidth(hp, 1) / 2, y + 80, 1, '#ff4466');

  const next = 'NEXT: LEVEL ' + (game.level + 1);
  if (Math.floor(game.transitionTimer * 3) % 2 === 0) {
    drawText(next, W / 2 - textWidth(next, 2) / 2, y + 110, 2, '#ffffff');
  }
}

function renderGameOver() {
  ctx.fillStyle = 'rgba(40, 10, 10, 0.85)';
  ctx.fillRect(0, 0, W, H);

  const t = 'GAME OVER';
  const shk = Math.sin(performance.now() / 80) * 2;
  drawText(t, W / 2 - textWidth(t, 4) / 2 + shk, 120, 4, '#ff3344');

  const s1 = 'SCORE: ' + game.score;
  const s2 = 'LEVEL: ' + game.level;
  const s3 = 'KILLS: ' + game.totalKills;
  const acc = game.shotsFired > 0 ? Math.round(game.shotsHit / game.shotsFired * 100) : 0;
  const s4 = 'ACCURACY: ' + acc + '%';
  drawText(s1, W / 2 - textWidth(s1, 2) / 2, 200, 2, '#ffff44');
  drawText(s2, W / 2 - textWidth(s2, 1) / 2, 235, 1, '#aaaaaa');
  drawText(s3, W / 2 - textWidth(s3, 1) / 2, 250, 1, '#aaaaaa');
  drawText(s4, W / 2 - textWidth(s4, 1) / 2, 265, 1, '#aaaaaa');

  if (game.score >= game.highScore && game.score > 0) {
    const nb = 'NEW BEST!';
    drawText(nb, W / 2 - textWidth(nb, 2) / 2, 295, 2, '#ff8844');
  }

  if (Math.floor(performance.now() / 500) % 2 === 0) {
    const r = 'PRESS R TO RESTART';
    drawText(r, W / 2 - textWidth(r, 2) / 2, 360, 2, '#ffffff');
  }
}

function renderPaused() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, W, H);
  const t = 'PAUSED';
  drawText(t, W / 2 - textWidth(t, 4) / 2, H / 2 - 20, 4, '#ffffff');
  const r = 'PRESS ESC TO RESUME';
  drawText(r, W / 2 - textWidth(r, 1) / 2, H / 2 + 25, 1, '#888888');
}

// ============================================================
// SECTION 10: GAME LOOP & INITIALIZATION
// ============================================================
let lastTime = 0;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  // Update
  if (game.state === 'PLAYING') updatePlaying(dt);
  else if (game.state === 'LEVEL_TRANSITION') updateTransition(dt);
  else if (game.state === 'MENU') game.menuTime += dt;

  // Render
  ctx.save();
  if (game.shake > 0 && game.shakeDur > 0) {
    const sx = (Math.random() - 0.5) * 2 * game.shake;
    const sy = (Math.random() - 0.5) * 2 * game.shake;
    ctx.translate(sx, sy);
  }

  if (game.state === 'MENU') {
    renderMenu();
  } else if (game.state === 'PLAYING') {
    renderBackground();
    renderBullets();
    renderEnemies();
    renderPlayer();
    renderParticles();
    renderFloatingTexts();
    renderHUD();
  } else if (game.state === 'LEVEL_TRANSITION') {
    renderTransition();
  } else if (game.state === 'GAME_OVER') {
    renderBackground();
    renderParticles();
    renderGameOver();
  } else if (game.state === 'PAUSED') {
    renderBackground();
    renderBullets();
    renderEnemies();
    renderPlayer();
    renderParticles();
    renderHUD();
    renderPaused();
  }

  ctx.restore();
  requestAnimationFrame(gameLoop);
}

resetGame();
requestAnimationFrame(gameLoop);
</script>
